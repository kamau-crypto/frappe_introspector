[supervisord]
nodaemon=true
user=appuser
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:redis]
command=redis-server --save "" --appendonly no --maxmemory 25mb --maxmemory-policy allkeys-lru --loglevel warning
autostart=true
autorestart=true
priority=10                      ; start Redis first, before gunicorn
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:gunicorn]
command=/opt/venv/bin/gunicorn
    --bind 0.0.0.0:5000
    --workers 2
    --worker-class sync
    --max-requests 1000
    --max-requests-jitter 100
    --timeout 120
    --graceful-timeout 30
    --keep-alive 5
    --log-level info
    --access-logfile -
    --error-logfile -
    --capture-output
    --enable-stdio-inheritance
    app:app
autostart=true
autorestart=true
priority=20                      ; start after Redis
startsecs=3                      ; wait 3s for Redis to be ready before gunicorn starts
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
